<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiquetas</title>

    <style>
        body {
            background: #f4f6f7;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #884ea0;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            width: 85%;
            margin: 15px auto;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .nombre {
            font-size: 20px;
            font-weight: bold;
            color: #512e5f;
            margin-bottom: 8px;
        }

        .descripcion {
            color: #2c3e50;
        }

        .fecha {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 10px;
        }

        .volver {
            display: block;
            width: 200px;
            margin: 20px auto;
            background: #884ea0;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover {
            background: #6c3483;
        }
    </style>
</head>

<body>

<h1>Listado de Etiquetas</h1>

<a href="/" class="volver"> Volver al menú</a>

{% if etiquetas %}
    {% for e in etiquetas %}
        <div class="card">
            <div class="nombre">{{ e.nombre }}</div>

            {% if e.descripcion %}
                <div class="descripcion">{{ e.descripcion }}</div>
            {% else %}
                <em>Sin descripción</em>
            {% endif %}

            <div class="fecha">Creada el {{ e.fecha_creacion }}</div>
        </div>
    {% endfor %}
{% else %}
    <p style="text-align:center;">No hay etiquetas registradas.</p>
{% endif %}

</body>
</html>
