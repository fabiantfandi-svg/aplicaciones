<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Artículos y Etiquetas</title>

    <style>
        body {
            background: #f4f6f7;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #1f618d;
            margin-bottom: 30px;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #1f618d;
            color: white;
        }

        tr:hover {
            background: #ecf0f1;
        }

        .volver {
            display: block;
            width: 220px;
            margin: 25px auto;
            background: #1f618d;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover {
            background: #154360;
        }

        .empty {
            text-align: center;
            margin-top: 40px;
            font-size: 18px;
            color: #7f8c8d;
        }
    </style>
</head>

<body>

<h1>Relación Artículos - Etiquetas</h1>

<a href="/" class="volver"> Volver al menú</a>

{% if artieti %}
<table>
    <tr>
        <th>ID</th>
        <th>Artículo</th>
        <th>Etiqueta</th>
        <th>Fecha asignación</th>
    </tr>

    {% for a in artieti %}
    <tr>
        <td>{{ a.id_articuloetiqueta }}</td>
        <td>{{ a.articulo.titulo }}</td>
        <td>{{ a.etiqueta.nombre }}</td>
        <td>{{ a.fecha_asignacion }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
    <div class="empty">No hay relaciones registradas.</div>
{% endif %}

</body>
</html>
